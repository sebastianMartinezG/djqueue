<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Bar Oasis</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #0a0a0f;
    color: #e8e8f0;
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  .box {
    background: #12121a;
    border: 1px solid #2a2a3a;
    border-radius: 16px;
    padding: 2.5rem;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  h1 { font-family:'Bebas Neue'; font-size:2rem; letter-spacing:5px; color:#ff3366; margin-bottom:0.3rem; }
  p  { font-size:0.7rem; color:#666680; letter-spacing:2px; margin-bottom:2rem; text-transform:uppercase; }
  label { display:block; font-size:0.65rem; letter-spacing:3px; color:#666680; text-align:left; margin-bottom:0.5rem; text-transform:uppercase; }
  input[type=password] {
    width:100%; background:rgba(255,255,255,0.04);
    border:1px solid #2a2a3a; border-radius:8px;
    color:#e8e8f0; font-family:'Space Mono'; font-size:1rem;
    padding:0.8rem 1rem; outline:none; margin-bottom:1.2rem;
    transition:border-color .2s;
  }
  input[type=password]:focus { border-color:#ff3366; }
  button {
    width:100%; background:linear-gradient(135deg,#ff3366,#cc0044);
    color:#fff; border:none; border-radius:8px;
    font-family:'Bebas Neue'; font-size:1.1rem; letter-spacing:3px;
    padding:0.9rem; cursor:pointer;
  }
  .error { color:#ff6666; font-size:0.75rem; margin-top:0.8rem; }
</style>
</head>
<body>
<div class="box">
  <h1>Bar Oasis</h1>
  <p>Panel de Administrador</p>
  <form method="POST">
    <label>Contraseña</label>
    <input type="password" name="password" autofocus placeholder="••••••••">
    <button type="submit">ENTRAR</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</div>
</body>
</html>
